<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17191b"><meta name="apple-mobile-web-app-capable" content="yes"><title>The Spirits Cabinet</title><link rel="manifest" href="manifest.webmanifest"><style>:root{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#f4eee5;background:#17191b}*{box-sizing:border-box}body{margin:0;padding-bottom:95px}header{padding:28px 18px 12px;background:#222426}h1{font-family:Georgia,serif;font-size:29px;margin:3px 0}h2{font-size:20px}small,.muted{color:#b8b0a6}.eyebrow{letter-spacing:2px;color:#d0a46c;font-size:11px}main{max-width:780px;margin:auto;padding:18px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:11px 13px;background:#b9874c;color:#191919;font-weight:650}button.secondary{background:#35383b;color:#f5eee5}button.danger{background:#6f3333;color:white}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#242629;border-top:1px solid #414141;padding:8px 4px max(12px,env(safe-area-inset-bottom));z-index:10}.tabs button{flex:1;background:transparent;color:#c7c2bb;font-size:12px;padding:8px 2px}.tabs button.active{color:#f4ba75}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card,.item{background:#292c2e;border:1px solid #3e4142;border-radius:15px;padding:16px}.metric{font-size:25px;font-weight:750;margin:7px 0}.item{display:flex;gap:12px;align-items:center;margin:9px 0}.item img{width:68px;height:86px;object-fit:contain;border-radius:8px;background:#1c1e1f}.item .info{flex:1;min-width:0}.item h3{margin:0 0 5px;font-size:16px}.item p{margin:3px 0;color:#b8b0a6;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}label{display:block;font-size:13px;color:#d6c5ad;margin:13px 0 5px}input,select,textarea{display:block;width:100%;padding:12px;background:#333638;color:#fff;border:1px solid #56595b;border-radius:10px}textarea{min-height:80px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hidden{display:none!important}.bar{height:9px;background:#434547;border-radius:8px;overflow:hidden;margin:7px 0}.bar>div{height:100%;background:#ba8749}.pill{font-size:11px;color:#f0cb94;background:#51412e;padding:4px 8px;border-radius:12px;display:inline-block}.empty{padding:35px 12px;text-align:center;color:#bcb4aa}.preview{max-width:130px;max-height:155px;object-fit:contain;margin-top:8px}.section{margin-top:25px}.footer-note{font-size:12px;color:#aaa39a;line-height:1.5}.line{border-top:1px solid #48494a;margin:15px 0}a{color:#e1b779}</style></head><body><header><div class="eyebrow">PRIVATE COLLECTION</div><h1>The Spirits Cabinet</h1><small>Whisky · Spirits · Wine</small></header><main><section id="dashboard"></section><section id="collection" class="hidden"></section><section id="editor" class="hidden"></section><section id="wishlist" class="hidden"></section><section id="reports" class="hidden"></section></main><nav class="tabs"><button data-tab="dashboard" class="active">◈<br>Home</button><button data-tab="collection">▤<br>Bottles</button><button data-tab="editor">＋<br>Add</button><button data-tab="wishlist">☆<br>Wishlist</button><button data-tab="reports">▥<br>Reports</button></nav><script>
const KEY='spirits-cabinet-v1';let db={bottles:[],wishlist:[],events:[]},editId=null,photo='';try{const old=JSON.parse(localStorage.getItem(KEY));if(old&&Array.isArray(old.bottles)){db={...db,...old}}}catch(e){}const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD',maximumFractionDigits:0}).format(+n||0),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),today=()=>new Date().toISOString().slice(0,10),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Device storage is full. Export a backup, then use smaller photos.')}};function go(tab){document.querySelectorAll('main section').forEach(s=>s.classList.toggle('hidden',s.id!==tab));document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));render();scrollTo(0,0)}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{if(b.dataset.tab==='editor')resetEditor();go(b.dataset.tab)});const val=b=>b.status==='Sealed'?(+b.estimate||0):(+b.estimate||0)*(+b.fill||0)/100;function render(){renderDashboard();renderCollection();renderWishlist();renderReports();if(!$('editor').innerHTML)renderEditor()}
function renderDashboard(){let total=db.bottles.length,est=db.bottles.reduce((s,b)=>s+val(b),0),sealed=db.bottles.filter(b=>b.status==='Sealed').length,brands=new Set(db.bottles.map(b=>b.brand.trim().toLowerCase())).size;let cats={};db.bottles.forEach(b=>cats[b.category]=(cats[b.category]||0)+1);$('dashboard').innerHTML=`<div class="cards"><div class="card"><small>Total bottles</small><div class="metric">${total}</div></div><div class="card"><small>Indicative collection value</small><div class="metric">${money(est)}</div></div><div class="card"><small>Brands</small><div class="metric">${brands}</div></div><div class="card"><small>Sealed / Open</small><div class="metric">${sealed} / ${total-sealed}</div></div></div><div class="section"><h2>By category</h2><div class="card">${Object.entries(cats).length?Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,n])=>`<div>${esc(c)} <span style="float:right">${n}</span></div><div class="bar"><div style="width:${n/total*100}%"></div></div>`).join(''):'<div class="empty">Add your first bottle to see your collection.</div>'}</div></div><div class="section"><h2>Highest-value bottles</h2>${db.bottles.slice().sort((a,b)=>val(b)-val(a)).slice(0,4).map(b=>item(b)).join('')||'<p class="muted">No bottles yet.</p>'}</div><div class="actions"><button onclick="resetEditor();go('editor')">＋ Add a bottle</button><button class="secondary" onclick="go('reports')">View reports</button></div><p class="footer-note">Values are estimates you enter or verify, not live market prices. Opened bottles are provisionally adjusted by remaining volume, not by collectible resale value.</p>`}
function item(b){return `<div class="item">${b.photo?`<img src="${b.photo}" alt="Bottle photograph">`:'<div style="width:68px;text-align:center;font-size:34px">🥃</div>'}<div class="info"><h3>${esc(b.brand)} ${esc(b.name)}</h3><p>${esc(b.category)} · ${esc(b.status)} · ${b.status==='Sealed'?100:b.fill}% remaining</p><p>${money(val(b))} · ${esc(b.size||'')} ml</p></div><button class="secondary" onclick="editBottle('${b.id}')">Edit</button></div>`}
function renderCollection(){let brands=[...new Set(db.bottles.map(b=>b.brand))].sort();$('collection').innerHTML=`<h2>My bottles (${db.bottles.length})</h2><input id="search" placeholder="Search brand, expression or notes" oninput="filterBottles()"><div class="two"><div><label>Category</label><select id="categoryFilter" onchange="filterBottles()"><option value="">All categories</option>${['Whisky','Bourbon','Rum','Gin','Vodka','Tequila','Brandy','Wine','Other'].map(x=>`<option>${x}</option>`).join('')}</select></div><div><label>Status</label><select id="statusFilter" onchange="filterBottles()"><option value="">All bottles</option><option>Sealed</option><option>Opened</option><option>Finished</option></select></div></div><div id="results"></div>`;filterBottles()}
function filterBottles(){let q=($('search')?.value||'').toLowerCase(),c=$('categoryFilter')?.value,s=$('statusFilter')?.value;let list=db.bottles.filter(b=>([b.brand,b.name,b.notes,b.country].join(' ').toLowerCase().includes(q))&&(!c||b.category===c)&&(!s||b.status===s));$('results').innerHTML=list.map(item).join('')||'<div class="empty">No matching bottles.</div>'}
function resetEditor(){editId=null;photo='';$('editor').innerHTML=''}function editBottle(id){editId=id;photo=db.bottles.find(b=>b.id===id)?.photo||'';renderEditor();go('editor')}
function renderEditor(){let b=db.bottles.find(x=>x.id===editId)||{};const field=(label,id,type='text',value='')=>`<label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}">`;const opts=(id,options,v)=>`<select id="${id}">${options.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`;$('editor').innerHTML=`<h2>${editId?'Edit bottle':'Add a bottle'}</h2><p class="muted">Photograph the bottle or choose an existing image, then enter its details. Automatic photo identification is planned for a later release.</p><label>Photograph</label><input id="photoInput" type="file" accept="image/*" capture="environment"><div id="photoPreview">${photo?`<img class="preview" src="${photo}">`:''}</div>${field('Brand *','brand','text',b.brand||'')}${field('Expression / bottle name *','name','text',b.name||'')}<div class="two"><div><label>Category</label>${opts('category',['Whisky','Bourbon','Rum','Gin','Vodka','Tequila','Brandy','Wine','Other'],b.category||'Whisky')}</div><div><label>Status</label>${opts('status',['Sealed','Opened','Finished'],b.status||'Sealed')}</div></div><div class="two"><div>${field('Bottle size (ml)','size','number',b.size||700)}</div><div>${field('ABV (%)','abv','number',b.abv||40)}</div></div><div class="two"><div>${field('Age statement (years)','age','number',b.age||'')}</div><div>${field('Country / region','country','text',b.country||'')}</div></div><label>Remaining fill level: <span id="fillText">${b.fill??100}%</span></label><input id="fill" type="range" min="0" max="100" step="5" value="${b.fill??100}" oninput="document.getElementById('fillText').textContent=this.value+'%'"><div class="two"><div>${field('Purchase price (AUD)','price','number',b.price||'')}</div><div>${field('Estimated sealed value (AUD)','estimate','number',b.estimate||'')}</div></div><div class="two"><div>${field('Purchase date','purchased','date',b.purchased||'')}</div><div>${field('Value checked on','valued','date',b.valued||'')}</div></div>${field('Storage location','location','text',b.location||'')}<label>Personal rating</label>${opts('rating',['Not rated','1','2','3','4','5'],b.rating||'Not rated')}<label>Tasting notes</label><textarea id="notes">${esc(b.notes||'')}</textarea><div class="actions"><button onclick="storeBottle()">Save bottle</button><button class="secondary" onclick="resetEditor();go('collection')">Cancel</button>${editId?'<button class="danger" onclick="deleteBottle()">Delete</button>':''}</div>`;$('photoInput').onchange=async e=>{let f=e.target.files[0];if(!f)return;let img=new Image(),url=URL.createObjectURL(f);img.onload=()=>{let canvas=document.createElement('canvas'),scale=Math.min(1,800/img.width,800/img.height);canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);photo=canvas.toDataURL('image/jpeg',.7);$('photoPreview').innerHTML=`<img class="preview" src="${photo}">`;URL.revokeObjectURL(url)};img.src=url}}
function storeBottle(){let get=id=>$(id).value,brand=get('brand').trim(),name=get('name').trim();if(!brand||!name){alert('Brand and bottle name are required.');return}let old=db.bottles.find(x=>x.id===editId),b={id:editId||crypto.randomUUID(),brand,name,photo,category:get('category'),status:get('status'),size:get('size'),abv:get('abv'),age:get('age'),country:get('country'),fill:get('status')==='Sealed'?100:get('status')==='Finished'?0:+get('fill'),price:get('price'),estimate:get('estimate'),purchased:get('purchased'),valued:get('valued'),location:get('location'),rating:get('rating'),notes:get('notes')};if(old){db.bottles=db.bottles.map(x=>x.id===editId?b:x)}else db.bottles.push(b);db.events.unshift({date:today(),action:old?'Updated bottle':'Added bottle',detail:brand+' '+name});save();resetEditor();go('collection')}
function deleteBottle(){if(!confirm('Permanently delete this bottle?'))return;let b=db.bottles.find(x=>x.id===editId);db.bottles=db.bottles.filter(x=>x.id!==editId);db.events.unshift({date:today(),action:'Deleted bottle',detail:b.brand+' '+b.name});save();resetEditor();go('collection')}
function renderWishlist(){$('wishlist').innerHTML=`<h2>Wishlist</h2><div class="card"><label>Brand</label><input id="wishBrand" placeholder="e.g. GlenDronach"><label>Expression</label><input id="wishName" placeholder="Bottle name"><label>Target price (AUD)</label><input id="wishPrice" type="number" min="0"><div class="actions"><button onclick="addWish()">Add to wishlist</button></div></div>${db.wishlist.map(w=>`<div class="item"><div class="info"><h3>${esc(w.brand)} ${esc(w.name)}</h3><p>Target ${money(w.price)}</p></div><button class="secondary" onclick="removeWish('${w.id}')">Remove</button></div>`).join('')||'<p class="muted">Your wishlist is empty.</p>'}`}
function addWish(){let brand=$('wishBrand').value.trim(),name=$('wishName').value.trim();if(!brand||!name)return alert('Enter a brand and expression.');db.wishlist.push({id:crypto.randomUUID(),brand,name,price:$('wishPrice').value});save();renderWishlist()}function removeWish(id){db.wishlist=db.wishlist.filter(w=>w.id!==id);save();renderWishlist()}
function renderReports(){let group={};db.bottles.forEach(b=>{let k=b.brand.trim();group[k]??={count:0,value:0};group[k].count++;group[k].value+=val(b)});let rows=Object.entries(group).sort((a,b)=>b[1].value-a[1].value);$('reports').innerHTML=`<h2>Collection reports</h2><div class="card"><h3>Value by brand</h3>${rows.map(([name,v])=>`<div style="padding:9px 0;border-bottom:1px solid #444"><b>${esc(name)}</b><span style="float:right">${v.count} bottles · ${money(v.value)}</span></div>`).join('')||'<p class="muted">No bottles to report.</p>'}</div><div class="section"><h2>Purchase & activity history</h2><div class="card">${db.events.slice(0,40).map(e=>`<p><small>${esc(e.date)}</small> — ${esc(e.action)}: ${esc(e.detail)}</p>`).join('')||'<p class="muted">Activity will appear here.</p>'}</div></div><div class="section"><h2>Export & backup</h2><div class="actions"><button onclick="exportJSON()">Download full backup</button><button class="secondary" onclick="exportCSV()">Export CSV</button><button class="secondary" onclick="insurance()">Insurance report</button></div><label>Restore a backup JSON file</label><input id="restore" type="file" accept="application/json,.json" onchange="restoreBackup(event)"><p class="footer-note">Full JSON backups include bottle photos, wishlist and activity history. CSV and insurance reports contain bottle details but not embedded photos. Keep backups somewhere secure.</p></div><div class="section card"><h2>Cloud sync & smart valuation</h2><p class="muted">Not connected in V1. This prototype stores data on this device only. Back up your data before clearing browser storage or changing phones. Photo identification, cloud accounts and live Australian market valuations require integration in later versions.</p></div>`}
function download(filename,contents,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([contents],{type}));a.href=u;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}function exportJSON(){download('spirits-cabinet-backup-'+today()+'.json',JSON.stringify({...db,exported:today()},null,2),'application/json')}function csv(rows){return rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\r\n')}const columns=['brand','name','category','status','size','abv','age','country','fill','price','estimate','purchased','valued','location','rating','notes'];function exportCSV(){download('spirits-cabinet-'+today()+'.csv',csv([columns,...db.bottles.map(b=>columns.map(c=>b[c]))]),'text/csv')}function insurance(){let headers=['Brand','Expression','Category','Status','Size ml','Purchase AUD','Estimated sealed AUD','Fill %','Location','Purchase date'];let rows=db.bottles.map(b=>[b.brand,b.name,b.category,b.status,b.size,b.price,b.estimate,b.fill,b.location,b.purchased]);download('spirits-cabinet-insurance-'+today()+'.csv',csv([headers,...rows]),'text/csv')}async function restoreBackup(e){let f=e.target.files[0];if(!f)return;try{let v=JSON.parse(await f.text());if(!Array.isArray(v.bottles)||!Array.isArray(v.wishlist)||!Array.isArray(v.events))throw Error('Invalid backup format');if(!confirm('Replace all current collection data with this backup?'))return;db={bottles:v.bottles,wishlist:v.wishlist,events:v.events};save();go('dashboard');alert('Backup restored.')}catch(err){alert('Unable to restore: '+err.message)}}render();
</script></body></html>
